<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MagaLog — Rastro Expresso (D0)</title>
  <style>
    :root {
      --bg: #0058cc;
      --pad-x: 6px;
      --pad-y: 5px;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      height: 100%;
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .bar {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      will-change: transform, filter;
      animation: rastroBar 4.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .b1 { animation-delay: 0.00s; }
    .b2 { animation-delay: 0.07s; }
    .b3 { animation-delay: 0.14s; }
    .b4 { animation-delay: 0.21s; }

    .wordmark-gleam {
      will-change: transform, opacity;
      animation: wordmarkSweep 4.8s cubic-bezier(0.35, 0, 0.2, 1) infinite;
    }

    @keyframes rastroBar {
      0%   { transform: translate3d(0px, 0, 0) scaleX(1);    filter: brightness(1); }
      6%   { transform: translate3d(-4px, 0, 0) scaleX(0.86); filter: brightness(1.06); }
      17%  { transform: translate3d(7px, 0, 0) scaleX(1.09);  filter: brightness(1.22); }
      28%  { transform: translate3d(-1.5px, 0, 0) scaleX(0.99); filter: brightness(1.05); }
      38%  { transform: translate3d(0px, 0, 0) scaleX(1);    filter: brightness(1); }
      100% { transform: translate3d(0px, 0, 0) scaleX(1);    filter: brightness(1); }
    }

    @keyframes wordmarkSweep {
      0%, 22% { transform: translate3d(-320px, 0, 0); opacity: 0; }
      28%     { opacity: 0.92; }
      56%     { opacity: 0.92; }
      64%, 100% { transform: translate3d(1140px, 0, 0); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar, .wordmark-gleam {
        animation: none !important;
      }
    }
  </style>
</head>
